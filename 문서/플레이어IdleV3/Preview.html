<!doctype html><html lang="ko"><meta charset="utf-8"><title>플레이어 v3 Idle — Unity 캡처</title><style>body{margin:0;background:#1e2924;color:#eee8dc;font:16px system-ui;text-align:center}main{max-width:920px;margin:24px auto}img{display:block;max-width:100%;height:auto;margin:auto;border-radius:12px}p{line-height:1.6;color:#cdd8cc}button,a{margin:8px;padding:10px 18px}a{color:#bde1bf}</style><main><h1>플레이어 v3 Idle</h1><p>호흡 · 모자와 양갈래의 작은 흔들림 · 눈 깜빡임</p><img id="frame" src="UnityIdle_00.png" width="512" height="640"><button id="play">일시 정지</button><a href="Ingame_Idle_Final.png">일반 게임 화면</a><p>실제 Unity 파츠 리그를 시간별로 샘플링한 확대 캡처입니다.<br>확인용으로 주변 적을 가리고 카메라를 확대했으며, 캡처 후 원래 상태로 복원했습니다.<br>일반 게임에서는 작은 크기로 표시됩니다. 프레임 간 전환은 실제 Animator의 연속 보간보다 거칠 수 있습니다.</p></main><script>
const times=[0,.3,.6,.9,1.2,1.5,1.8,2.1,2.4,2.54,2.60,2.67,2.74,2.82,3,3.3,3.6];const images=times.map((_,i)=>{const image=new Image();image.src="UnityIdle_"+String(i).padStart(2,"0")+".png";return image;});let running=true,time=0,prev,last=-1;document.getElementById("play").onclick=()=>{running=!running;document.getElementById("play").textContent=running?"일시 정지":"재생"};function tick(now){if(prev&&running)time+=(now-prev)/1000;prev=now;let index=0;for(let i=0;i<times.length;i++)if(times[i]<=time%3.6)index=i;if(last!==index){document.getElementById("frame").src=images[index].src;last=index;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
